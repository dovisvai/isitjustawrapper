name = "is-it-just-a-wrapper"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

# Traffic on /stats comes from Cloudflare's zone analytics API. It needs two
# values set in the dashboard (project, Settings, Variables and Secrets), never
# here, because this repository is public:
#
#   CF_API_TOKEN  secret — a token with Zone > Analytics > Read on this zone
#   CF_ZONE_ID    text   — the zone id from the domain's Overview page
#
# Sponsor clicks are counted in KV, only once a slot is sold. Bind a namespace in
# the dashboard as STATS. For local testing with `npm run dev:functions`, you can
# uncomment this block and paste an id — do not commit that change.
#
# [[kv_namespaces]]
# binding = "STATS"
# id = "your-kv-namespace-id"
#
# Without any of these the site still works — /stats says traffic figures are not
# configured rather than showing invented numbers.

[vars]
# Used to tag sponsor outbound links. Set this to the production origin.
SITE_ORIGIN = "https://isitjustawrapper.com"
